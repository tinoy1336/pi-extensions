# Structural checks. No model calls: the check job runs the workspace gates, and the
# smoke job installs the `npm pack` tarballs in a clean container and loads the
# extension there (the failure class it exists for is a package that installs for its
# author and throws for a stranger).
#
# The Release workflow triggers on this workflow's successful completion on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The version the packages declare as their floor (`engines.node`).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:pack
      - run: npm run check:caveats

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke

  # The canon system-prompt rig: four offline harnesses over the canon package's prompt
  # seam (byte-stability across a typed run and an injected wake, the shared seam package,
  # and the child-prompt freeze). No container, no provider, no pi install — it is the fast
  # suite, not the matrix. `npm ci` is what the modules under test resolve their imports
  # through: the `@tinoy/*` workspace links and @earendil-works/pi-ai in the root tree.
  canon-rig:
    name: canon-rig
    runs-on: ubuntu-latest
    needs: check
    # The runner bounds nothing itself (four node scripts that exit on their own); this is
    # the ceiling that catches a stall. A harness failure is named and annotated by the
    # wrapper, and a precondition failure is reported as itself, never as a package defect.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the canon-prefix rig
        run: bash test-rigs/canon-prefix/ci.sh

  # The subset matrix: every case installs its own tarballs in a clean container and is
  # judged on the five clauses (load errors, entries loaded, tool sets, declared absences,
  # registration failures). This is the container path's first real execution: locally only
  # `--local` has ever run, which uses the same runner and installer without an image.
  smoke-matrix:
    name: smoke-matrix
    runs-on: ubuntu-latest
    needs: check
    # A ceiling, not the working bound: docker/matrix.mjs has no bound of its own while
    # scripts/smoke-matrix.sh bounds the image build (900s) and the container run (3600s).
    # Sitting above their sum (75 min) is deliberate — the phase timeout fires first and
    # names the phase, and this only catches a stall outside both.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Container engine
        run: docker info --format 'docker {{.ServerVersion}}'
      - name: Run the subset matrix in the container
        run: bash .github/scripts/smoke-matrix-ci.sh
