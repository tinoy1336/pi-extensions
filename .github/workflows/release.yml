# Release automation: a merge to main may version, changelog, tag and publish with no
# human step. Publishing authenticates with the NPM_TOKEN repository secret: a granular
# access token is the one credential class a build runner can hold, because the
# trusted-publisher endpoint demands an interactive 2FA challenge that CI cannot answer.
# The job keeps `id-token: write` and still attempts the OIDC exchange first, so a package
# whose trusted publisher is wired keeps using it. See RELEASING.md for the bootstrap, the
# credential it needs, and the rollback of a bad publish.
#
# The trigger is the CI run's successful completion on main, so a release only ever
# happens on a commit the check job has already passed. The checkout is pinned to the
# exact commit CI verified (and the branch name is put on it, because semantic-release
# resolves its branch locally), so a main that moves on between the two workflows does
# not release unchecked commits.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to release (both, or one key from RELEASE_ORDER)
        type: string
        default: both

permissions:
  contents: read

# One release at a time: every package shares the branch and the lockfile.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    env:
      # Dependency order, dependencies first: a dependent package's install resolves its
      # dependencies from the registry, so a package that is not released before its
      # dependent cannot be installed at all (measured: resolving one of the new packages
      # against the registry answered 404 while its dependency was unpublished). Every key
      # sits AFTER every package it depends on: ext-lib, then focus-state and tariff (tariff
      # itself imports ext-lib), then every package that imports one of them, and the three
      # dependency-free packages (cache-prefix-log, child-request-dump, no-subagent-fork)
      # anywhere after the two libraries. This list is the only edit a new release config
      # needs. A key whose release/<key>.mjs has not landed yet is skipped with a notice
      # instead of failing the run, and a key must be the tag prefix its own config declares
      # (release/canon.mjs: tagFormat canon-v${version}), because the withdrawal derives the
      # version from that prefix. The keys after todo-parent are the four that reach only the
      # libraries above — deepseek-cost and fleet read tariff, cli-keys and sudo-approve read
      # ext-lib alone — and they keep that order so a dependent is published after its
      # dependency whatever position the rest of the list takes.
      RELEASE_ORDER: ext-lib ipc focus-state tariff cache-prefix-log child-request-dump no-subagent-fork canon build child-prompt-freeze command-guard desktop-notify drift-anchor focus-gate image-read nf orphan-repair pause probe read-staleness status-metrics todo-parent deepseek-cost io-guard fleet cli-keys sudo-approve
      INPUT_PACKAGE: ${{ inputs.package }}
    permissions:
      contents: write # push the release commit and tags, create the GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - name: Check out the commit CI verified
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0 # semantic-release reads the full history and every tag

      - name: Put the branch name on that commit
        if: github.event_name == 'workflow_run'
        run: git checkout -B main

      # Node 24 for its npm: the OIDC exchange attempted below needs npm >= 11.5.1 and
      # Node 22 bundles npm 10.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Identify the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Each package is released on its own tag and its own commits. The gate refuses when
      # nothing in the package changed since its tag, which is what keeps a canon-only push
      # from publishing a new ext-lib. A package with NO tag at all is refused before the
      # gate is consulted: a tag is what semantic-release measures the next version from, so
      # with none it computes a first release of 1.0.0 for a package whose manifest carries
      # 0.1.0. The first publish is the manual bootstrap in RELEASING.md. Packages run in
      # RELEASE_ORDER, one after the other, because a dependent's dependency has to be in the
      # registry by the time the dependent is published.
      # Publishing auth: @semantic-release/npm asks the registry for an OIDC token first
      # (npm trusted publishing) and, when that exchange does not succeed, writes
      # `NPM_TOKEN` into the temporary .npmrc it hands to `npm publish` — so a package with
      # no trusted publisher publishes on the token instead of stopping at ENONPMTOKEN.
      # NPM_CONFIG_PROVENANCE keeps the attestation the OIDC path gets for free: with it,
      # `npm publish` signs a provenance statement from the job's OIDC identity, which is
      # why `id-token: write` stays on this job in token mode too.
      - name: Release the packages, in dependency order
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          want="${INPUT_PACKAGE:-both}"
          matched=0
          for pkg in ${RELEASE_ORDER}; do
            if [ "${want}" != "both" ] && [ "${want}" != "${pkg}" ]; then
              continue
            fi
            matched=1

            config="./release/${pkg}.mjs"
            if [ ! -f "${config}" ]; then
              # A package in the order whose config has not landed yet is skipped, so an
              # automatic run keeps going while the configs arrive. An explicit dispatch
              # naming that package is a request, so it fails instead of reporting success
              # for a release that could not happen.
              if [ "${want}" != "both" ]; then
                echo "::error::${config} is not in the repository yet — ${pkg} cannot be released" >&2
                exit 2
              fi
              echo "::notice::${config} is not in the repository yet — skipping ${pkg}"
              continue
            fi

            # Refuse a package with no baseline tag. A tag is the version semantic-release
            # measures from: with none it computes a FIRST release of 1.0.0
            # (semantic-release lib/get-next-version.js, FIRST_RELEASE) and prepares that
            # version into the manifest, so an untagged package is published with the wrong
            # major. The first publish is the manual bootstrap in RELEASING.md — which is
            # what publishes the package by hand and pushes its `<pkg>-v0.1.0` tag — and CI
            # must not stand in for it. An automatic run skips the package and releases the
            # rest; an explicit dispatch that named it fails, because it asked for a release
            # that cannot happen.
            baseline="$(git describe --tags --abbrev=0 --match "${pkg}-v*" 2>/dev/null || true)"
            if [ -z "${baseline}" ]; then
              if [ "${want}" != "both" ]; then
                echo "::error::${pkg} has no baseline tag ${pkg}-v* — its first publish is the manual bootstrap in RELEASING.md: publish the package by hand, then push ${pkg}-v0.1.0" >&2
                exit 2
              fi
              echo "::warning::${pkg} has no baseline tag ${pkg}-v* — skipping it; the package needs the manual bootstrap in RELEASING.md before CI can release it"
              continue
            fi

            if ! bash scripts/release-relevant.sh "${pkg}"; then
              continue
            fi

            package_name="$(node -p "require('./packages/${pkg}/package.json').name")"
            before="${RUNNER_TEMP}/tags-before-${pkg}.txt"
            git tag | sort > "${before}"

            echo "::group::semantic-release ${package_name} (${pkg})"
            release_status=0
            npx --no-install semantic-release --extends "${config}" || release_status=$?
            echo "::endgroup::"

            if [ "${release_status}" -ne 0 ]; then
              # semantic-release creates the tag before it runs the publish plugins, so a
              # failed publish would otherwise leave the tag behind. The snapshot above is
              # the set of tags that predate this package's release, and the helper asks the
              # registry first: a release that failed after npm publish succeeded keeps its
              # tag, so the next run cuts the following version instead of the one npm
              # already holds.
              bash .github/scripts/withdraw-tag-if-unpublished.sh "${before}" "${package_name}" "${pkg}-v" || true
              exit "${release_status}"
            fi
          done

          if [ "${matched}" -eq 0 ]; then
            echo "::error::no package matches '${want}' — RELEASE_ORDER is: ${RELEASE_ORDER}" >&2
            exit 2
          fi
