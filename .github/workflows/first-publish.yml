# First publish of one package, by hand — the case release.yml's baseline-tag guard
# excludes. semantic-release measures the next version from the last tag, so a package
# with no tag at all is prepared as a first release of 1.0.0 instead of the version its
# manifest carries; the guard refuses such a package rather than publish a wrong major.
# This workflow is the route past that refusal for exactly one publish: it publishes the
# version already in `packages/<key>/package.json`, and it stops the moment the registry
# holds any version of the package, which is what keeps it from ever publishing a second
# one. A first publish stays a deliberate, named act — there is no input for a version, a
# dist-tag or a set of packages, and no route here that publishes without a dispatch.
#
# Reachable only by that dispatch: there is no push, pull_request or workflow_run trigger,
# so a merge to main cannot start it, and the job holds no `contents: write` permission —
# it creates no tag and pushes no commit. Tagging is the other half of the bootstrap (see
# RELEASING.md): the baseline tag has to sit on the commit whose manifest carries the
# version that was just published, which is a fact about that commit, not about the run.
name: First publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package key to publish for the first time (one RELEASE_ORDER key from release.yml, e.g. sudo-approve)
        type: string
        required: true

permissions:
  contents: read

# The same group release.yml holds: a release running at the same time would publish
# against the same registry account, and the two paths should not overlap on it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  first-publish:
    name: first publish
    runs-on: ubuntu-latest
    # A ceiling, not the working bound: the publish is one request and the read-back polls
    # for the registry's own propagation lag, which is minutes.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the provenance attestation; nothing here pushes anything
    env:
      # `npm publish` signs an attestation from the job's OIDC identity when provenance is
      # on, which is the same statement the release job's publish carries and why the repo
      # has to stay public for it to be accepted.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 for its npm: the version the release job publishes with.
          node-version: 24
          cache: npm
          # The registry the publish goes to, and the credentials file setup-node writes
          # for it — an npmrc carrying the literal `_authToken = ${NODE_AUTH_TOKEN}` that
          # the steps below resolve from the secret in the environment. The token value is
          # never an argument, never an echo.
          registry-url: https://registry.npmjs.org

      # Resolve the key to one package directory and read the name and version out of its
      # manifest: those two values are the whole input to the publish, and every later step
      # reads them from here instead of recomputing them.
      - name: Resolve the named package
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          want="${INPUT_PACKAGE}"
          case "${want}" in
            ""|both)
              echo "::error::name exactly one package key (e.g. sudo-approve) — this path publishes a first version of one package, never a set" >&2
              exit 2
              ;;
            *[!a-z0-9-]*)
              echo "::error::'${want}' is not a package key — a RELEASE_ORDER key is lowercase letters, digits and hyphens" >&2
              exit 2
              ;;
          esac

          dir="packages/${want}"
          if [ ! -f "${dir}/package.json" ]; then
            echo "::error::no ${dir}/package.json in this repository — name a package key that exists" >&2
            exit 2
          fi

          pkg_name="$(node -p "require('./${dir}/package.json').name")"
          pkg_version="$(node -p "require('./${dir}/package.json').version")"
          echo "::notice::${want} is ${pkg_name}@${pkg_version}"

          {
            echo "PKG_KEY=${want}"
            echo "PKG_DIR=${dir}"
            echo "PKG_NAME=${pkg_name}"
            echo "PKG_VERSION=${pkg_version}"
          } >> "${GITHUB_ENV}"

      # The refusal that makes this path safe to leave in the repository: it publishes a
      # FIRST version and nothing else. The registry's own answer decides, so the check
      # holds however often the workflow is dispatched and whatever happens to the
      # manifests — a package that already has any version is refused here, before any
      # credential is presented and before npm is asked to write.
      - name: Refuse unless the registry has no version of this package
        run: |
          set -euo pipefail
          # `/` percent-encoded: a scoped name is one path segment on the registry.
          url="https://registry.npmjs.org/${PKG_NAME/\//%2f}"
          packument="${RUNNER_TEMP}/packument.json"

          code="$(curl -sS --max-time 30 --retry 2 --retry-connrefused \
            -o "${packument}" -w '%{http_code}' "${url}")" || {
            echo "::error::could not reach the registry to ask whether ${PKG_NAME} exists" >&2
            exit 2
          }

          case "${code}" in
            404)
              echo "::notice::the registry has no ${PKG_NAME} — this is its first publish, at ${PKG_VERSION}"
              ;;
            200)
              existing="$(node -e 'const p=require(process.argv[1]); console.log(Object.keys(p.versions || {}).join(", "))' "${packument}")"
              echo "::error::${PKG_NAME} is already on the registry at ${existing} — this path refuses to publish a second version of anything" >&2
              exit 2
              ;;
            *)
              echo "::error::the registry answered ${code} for ${PKG_NAME} — refusing to publish without a definite 404" >&2
              exit 2
              ;;
          esac

      # One publish, of the manifest's own version, public (a scoped package's first
      # release is restricted by default) and with the provenance statement the job's
      # OIDC identity signs. `--access public` is the only flag: no `--tag`, so the
      # version lands on `latest` exactly as a dependency install would find it.
      - name: Publish the manifest version with public access and provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty — the repository secret is the credential this path publishes with" >&2
            exit 2
          fi

          echo "::group::npm publish ${PKG_NAME}@${PKG_VERSION}"
          ( cd "${PKG_DIR}" && npm publish --access public )
          echo "::endgroup::"

      # The registry's read path lags its write path (a published version can take
      # minutes to answer), so the confirmation is a bounded poll rather than a single
      # read, and the step fails if the version never appears.
      - name: Read the version back from the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published=""
          for attempt in $(seq 1 15); do
            published="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${PKG_VERSION}" ]; then
              echo "::notice::the registry answers ${PKG_NAME}@${PKG_VERSION} (read-back ${attempt})"
              break
            fi
            echo "read-back ${attempt}: the registry does not answer ${PKG_NAME}@${PKG_VERSION} yet"
            sleep 20
          done

          if [ "${published}" != "${PKG_VERSION}" ]; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} is not on the registry after the publish — the publish did not land" >&2
            exit 2
          fi

          latest="$(npm view "${PKG_NAME}" dist-tags.latest)"
          if [ "${latest}" != "${PKG_VERSION}" ]; then
            echo "::error::the registry's latest for ${PKG_NAME} is ${latest}, not ${PKG_VERSION}" >&2
            exit 2
          fi

          {
            echo "### First publish: ${PKG_NAME}@${PKG_VERSION}"
            echo
            echo "Published with public access and provenance, read back from the registry as \`latest\`."
            echo
            echo "The baseline tag for this version is the next half of the bootstrap: push \`${PKG_KEY}-v${PKG_VERSION}\` on the commit whose manifest carries ${PKG_VERSION}."
          } >> "${GITHUB_STEP_SUMMARY}"
